name: Sync upstream master

# Keeps this fork's `master` current with deepseek-ai/deepseek-harness.
#
# `master` carries a few local commits (the plugin-facing session-event write
# side, the Trajectory extension row, and their docs), so this is a merge, not a
# fast-forward. A clean merge pushes straight to `master`; a conflict aborts and
# fails the run rather than leaving a half-merged branch behind.
#
# Scheduled workflows are disabled by default in a fork: enable Actions once in
# this repository's Actions tab. Run it by hand from the Actions tab at any
# time. For a machine-local equivalent, use ./sync-upstream.sh.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream master
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'master already contains upstream/master'
            exit 0
          fi
          if git merge --no-edit upstream/master; then
            git push origin master
            exit 0
          fi
          git merge --abort
          echo '::error::upstream/master conflicts with the local commits on master; resolve it locally with ./sync-upstream.sh'
          exit 1
