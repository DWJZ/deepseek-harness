name: Sync upstream master

# Keeps this fork's `master` current with deepseek-ai/deepseek-harness.
#
# The merge lives in ./sync-upstream.sh, which this job runs after installing the
# workspace: a conflict inside a generated document is resolved by re-running
# that document's generator over the merged tree and requiring its freshness
# gate to accept the result. Every other conflict still fails the run rather than
# leaving a half-merged branch behind.
#
# Scheduled workflows are disabled by default in a fork: enable Actions once in
# this repository's Actions tab. Run it by hand from the Actions tab at any
# time. For the same merge from a local checkout, run ./sync-upstream.sh.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      # The generators rebuild documents from source, so the workspace the merge
      # resolves conflicts in has to be installed first.
      - name: Install the workspace
        run: pnpm install --frozen-lockfile
      - name: Merge upstream master
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          ./sync-upstream.sh
